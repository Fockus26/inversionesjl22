; PHP for the local copy (docker-compose.yml). A real WooCommerce site loads 20,000+ PHP
; files; the image's default opcache (4,000 files, 128 MB) thrashed and every request read
; and compiled them again through the slow Windows mount (~50 s per page).
opcache.enable=1
opcache.memory_consumption=512
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=60000
; Still checks for edits (the repo's plugin and theme are live): an edit shows up within 5 s.
opcache.validate_timestamps=1
opcache.revalidate_freq=5
realpath_cache_size=16M
realpath_cache_ttl=600
memory_limit=512M
