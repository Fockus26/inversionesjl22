# Deploy over SSH (web-agent-kit, reference/tech/wordpress.md §5, from wordpress/deploy-ssh.yml).
# Each merge to main goes to staging (GoDaddy's staging site); production is this same workflow
# run by hand (Actions → Deploy → Run workflow → production) after César checks staging.
#
# Secrets per GitHub environment (staging, production) — an action for César:
#   DEPLOY_HOST          e.g. 985270.us32.ssh.myftpupload.com (staging) / 892841.… (production)
#   DEPLOY_USER          the SSH user from GoDaddy's panel
#   DEPLOY_PATH          the WordPress root, relative to the user's home (GoDaddy: html)
#   DEPLOY_SSH_KEY       a deploy-only private key, its public half added in GoDaddy's panel
#   DEPLOY_SSH_PASSWORD  GoDaddy Managed WordPress asks for key AND password: ssh gets it from
#                        SSH_ASKPASS (scripts/ssh-askpass.sh), never on a command line
#   DEPLOY_KNOWN_HOSTS   the host's `ssh-keyscan` line, checked once by César: never scanned
#                        here, which would trust whatever answers
# The production environment has César as a required reviewer.
#
# Until the secrets exist, the job says so and stops without failing (each merge would
# otherwise be a red X). Only the site plugin is uploaded: the child theme is not active, and
# the vendored PDF Invoices plugin is not deployed from here (it is updated with the plugin's
# own release, its changes re-applied: see the project memory).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: staging or production
        type: choice
        options: [staging, production]
        default: staging

env:
  SITE_PLUGIN: inversionesjl22-site

concurrency:
  group: deploy-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'staging' }}
    steps:
      - name: Secrets present?
        id: ready
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::notice::Deploy skipped: the ${{ inputs.target || 'staging' }} environment has no DEPLOY_* secrets yet."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'

      - name: php -l
        if: steps.ready.outputs.ok == 'true'
        run: bash scripts/php-lint.sh

      - name: SSH key
        if: steps.ready.outputs.ok == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # --delay-updates: the new files are put in place at the end, all together, so a request
      # does not meet half of the plugin. --delete: a file removed in git is removed there.
      - name: Upload
        if: steps.ready.outputs.ok == 'true'
        env:
          REMOTE: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          ROOT: ${{ secrets.DEPLOY_PATH }}
          PULL_SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: |
          export SSH_ASKPASS="$PWD/scripts/ssh-askpass.sh" SSH_ASKPASS_REQUIRE=force
          rsync -rlz --checksum --delete --delay-updates --exclude '.git*' --exclude 'node_modules/' --exclude '*.scss' \
            -e "ssh -i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            "wp-content/plugins/$SITE_PLUGIN/" "$REMOTE:$ROOT/wp-content/plugins/$SITE_PLUGIN/"

      # The plugin is activated by hand the first time (together with turning WPCodeBox off,
      # plans/adoption.md §7): while it is not active there is no `wp inversionesjl22-site`.
      - name: Migrations
        if: steps.ready.outputs.ok == 'true'
        env:
          REMOTE: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          ROOT: ${{ secrets.DEPLOY_PATH }}
          PULL_SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: |
          export SSH_ASKPASS="$PWD/scripts/ssh-askpass.sh" SSH_ASKPASS_REQUIRE=force
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$REMOTE" "cd '$ROOT' && \
            if wp plugin is-active $SITE_PLUGIN; then wp $SITE_PLUGIN migrate && wp cache flush; \
            else echo 'plugin not active yet: migrations skipped'; fi"
